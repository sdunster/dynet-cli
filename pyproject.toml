[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dynet-cli"
version = "0.2.1"
description = "Command-line tool to watch, control and capture a Signify Dynalite DyNet bus"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sam Dunster", email = "me@sdunster.com" }]
requires-python = ">=3.13"
dependencies = ["aiodynet>=0.3.0"]
keywords = ["dynalite", "dynet", "signify", "lighting", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Typing :: Typed",
]

[project.scripts]
dynet = "dynet_cli.cli:main"

[project.urls]
Homepage = "https://github.com/sdunster/dynet-cli"
Issues = "https://github.com/sdunster/dynet-cli/issues"

[dependency-groups]
dev = [
  "mypy>=2.4",
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7.0",
  "pytest-timeout>=2.4",
  "ruff>=0.17",
]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
timeout = 30
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["dynet_cli"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "assert_never\\(",
  "raise AssertionError",
  "if __name__ == .__main__.:",
]

[tool.mypy]
strict = true
python_version = "3.13"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "explicit-override"]
files = ["src", "tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",   # conflicts with the formatter
  "D203",     # incompatible with D211
  "D213",     # incompatible with D212
  "PLR2004",  # magic values are the protocol
  "CPY001",   # the licence is in LICENSE
  "ASYNC109", # network waits take an explicit timeout on purpose
  "T201",     # a CLI prints
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "SLF001", "PLR0913", "FBT", "EM101", "TRY003", "SIM300"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
