name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing, no API token stored
      contents: write # attach the built files to the GitHub release
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Check the tag matches the package version
        run: |
          version=$(uv version --short)
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - run: uvx twine check --strict dist/*
      - run: uv publish --trusted-publishing always
      - name: Build the single-file dynet.pyz
        run: |
          mkdir -p pyz-out
          mv dist pypi-dist
          scripts/build-pyz
          mv dist/dynet.pyz pyz-out/
      - name: Attach the files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" pypi-dist/* pyz-out/dynet.pyz
